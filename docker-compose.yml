services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fieldops}
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - fieldops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  init:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fieldops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fieldops}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    command:
      [
        "sh",
        "-c",
        'pnpm db:migrate && if [ "$$DEMO_ENABLED" = true ]; then pnpm db:seed; fi',
      ]
    depends_on:
      db:
        condition: service_healthy
  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fieldops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fieldops}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  fieldops_pg:
